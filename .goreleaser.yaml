# GoReleaser configuration for ModemPhone.
#
#   goreleaser release --clean    # tag and publish a release
#
# The Windows binary is linked against the GUI subsystem, so it launches
# without a terminal window appearing behind it. That is done with
# -H windowsgui in the linker flags rather than a build tag, so the same
# sources produce a console build for debugging with `go build ./...`.
version: 2

project_name: ModemPhone

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: windows
    main: ./cmd/modemphone
    binary: modemphone
    goos: [windows]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -H windowsgui
      # The version is injected so the app can report which build is running.
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

    # The icon is compiled into the executable as a Windows resource, so
    # Explorer and the taskbar show it. The .syso is generated by install.ps1
    # tooling and is not committed.
    hooks:
      pre:
        - cmd /c "if not exist rsrc_windows_amd64.syso exit /b 0"

archives:
  - id: windows
    ids: [windows]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - src: install.ps1
        dst: install.ps1

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
  groups:
    - title: Features
      regexp: '^.*(feat|add|support|implement)[:].*'
    - title: Fixes
      regexp: '^.*(fix|resolve|repair)[:].*'
    - title: Other
      regexp: '.*'

# No Homebrew, Scoop or Docker publishing: this is a desktop app and those
# channels would only add noise.
release:
  draft: false
  prerelease: auto
  replace_existing_draft: true
  footer: |
    ---
    Built from `{{ .ShortCommit }}`.
    Windows builds launch without a console window.
